name: update-holidays

on:
  schedule:
    # 每月 1 日 03:23 UTC（北京时间 11:23）自动运行
    - cron: '23 3 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch and build holidays.json
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime

          year = datetime.date.today().year
          years = [year, year + 1]
          holidays, workdays = set(), set()
          ok_years = []

          # 数据源：timor.tech 免费节假日 API（含法定节假日与调休补班）
          for y in years:
              try:
                  with urllib.request.urlopen(
                      f'https://timor.tech/api/holiday/year/{y}', timeout=30
                  ) as r:
                      data = json.load(r)
                  for k, v in (data.get('holiday') or {}).items():
                      date = f'{y}-{k}'
                      if not (len(date) == 10 and date[4] == '-'):
                          continue
                      if v.get('holiday'):
                          holidays.add(date)
                      else:
                          workdays.add(date)
                  ok_years.append(y)
              except Exception as e:
                  print(f'year {y} fetch failed: {e}')

          if not ok_years:
              print('all sources failed, keep existing data')
          else:
              # 与现有数据合并（只增不减，避免接口异常误删）
              try:
                  old = json.load(open('holidays.json', encoding='utf-8'))
                  holidays |= set(old.get('holidays', []))
                  workdays |= set(old.get('workdays', []))
              except Exception:
                  pass

              out = {
                  'version': 2,
                  'region': 'CN',
                  'holidays': sorted(holidays),
                  'workdays': sorted(workdays),
              }
              with open('holidays.json', 'w', encoding='utf-8') as f:
                  json.dump(out, f, ensure_ascii=False, indent=2)
              print(f'updated from years {ok_years}: '
                    f'holidays={len(holidays)} workdays={len(workdays)}')

          # 记录检查时间戳（保持仓库活跃，防止定时任务被 GitHub 自动停用）
          with open('.holiday-last-check', 'w', encoding='utf-8') as f:
              f.write(datetime.datetime.utcnow().isoformat())
          PY

      - name: commit if changed
        run: |
          git config user.name "holiday-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add holidays.json .holiday-last-check
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto: refresh holidays data"
            git push
          fi
